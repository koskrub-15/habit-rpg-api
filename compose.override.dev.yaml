services:
  app:
    build:
      target: final

    ports:
      - "60000:8000"

    volumes:
      - ./files:/wd/files

    develop:
      watch:
        # Sync the entire apps directory
        - action: sync
          path: ./apps/
          target: /wd/apps/

        # Rebuild on dependency changes
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
          # Rebuild on Python version change
        - action: rebuild
          path: .python-version

    init: true

    command: ["--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - DATABASE_URL
      - SECRET_KEY
      - DEBUG
      - API_BASE_URL
      - PROJECT_NAME
    depends_on:
      - db

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=habit_api_db
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d habit_api_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
