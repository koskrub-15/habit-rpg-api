name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: test-secret-key
          COVERAGE_CORE: sysmon
        run: uv run pytest tests/ --cov=apps --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run pre-commit hooks
        env:
          SKIP: no-commit-to-branch
        uses: pre-commit/action@v3.0.1

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      # ecdsa PYSEC-2026-1325 (Minerva timing side-channel) has no fix release —
      # upstream declines to patch it; pulled in transitively via python-jose.
      - name: Audit dependencies
        run: >-
          uv export --frozen --no-emit-project
          | uvx pip-audit -r /dev/stdin --ignore-vuln PYSEC-2026-1325

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test, lint]
    # Safety switch: stays "skipped" (never red) until you set the repository
    # variable DEPLOY_ENABLED=true. Flip it on once Fly billing is set up and
    # the FLY_API_TOKEN secret exists. Deploys on push to main or a manual run.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch')
    # One deploy at a time; queued runs wait instead of racing. We do NOT cancel
    # an in-flight deploy — that could leave the release half-applied.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://habit-api.fly.dev/
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
