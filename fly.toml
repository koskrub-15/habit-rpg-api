# Fly.io deployment config. `fly launch` reads this to create/update the app.
# `app` must be globally unique across Fly — change it if the name is taken.
app = "habit-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

# Runs in a temporary machine before each deploy, on the freshly built image.
# Our docker-entrypoint.sh sees "alembic" (not a flag) and runs it verbatim.
[deploy]
  release_command = "alembic upgrade head"

# Non-secret config. Secrets (DATABASE_URL, SECRET_KEY) go via `fly secrets set`.
[env]
  PROJECT_NAME = "Habit RPG API"
  API_BASE_URL = "https://habit-api.fly.dev/"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Fly polls /health to decide if a machine is healthy before sending traffic.
  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
